<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title> Browse Available Teams | RecLeague</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

  <!-- Navbar -->
  <nav class="navbar navbar-dark bg-success">
    <div class="container">
      <a class="navbar-brand" href="../index.html">RecLeague</a>
      <div>
        <a class="text-white me-3" href="browse-teams.html">Browse Teams</a>
        <a class="text-white me-3" href="my-profile.html">My Profile</a>
        <a class="text-white" href="../index.html">Log Out</a>
      </div>
    </div>
  </nav>

  <div class="container my-4">
    <h1>Find a team</h1>

    <!-- Filtering by sport -->
    <select id="sportFilter" class="form-select w-25 mb-4" onchange="filterTeams()">
      <option value="all">All sports</option>
      <option value="Basketball">Basketball</option>
      <option value="Soccer">Soccer</option>
      <option value="Volleyball">Volleyball</option>
    </select>

    <!-- Team cards (fake data for now) -->
    <div class="row">

      <div class="col-md-4 mb-3 team-card" data-sport="Basketball">
        <div class="card">
          <div class="card-body">
            <h5>Genyu Forces</h5>
            <p>Basketball, Intermediate<br>Tuesdays 6pm<br>2 spots open</p>
            <a href="team-detail.html" class="btn btn-success">View team</a>
          </div>
        </div>
      </div>

      <div class="col-md-4 mb-3 team-card" data-sport="Soccer">
        <div class="card">
          <div class="card-body">
            <h5>The Saiyans</h5>
            <p>Soccer, Intermediate<br>Sundays 6pm<br>4 spots open</p>
            <a href="team-detail.html" class="btn btn-success">View team</a>
          </div>
        </div>
      </div>

      <div class="col-md-4 mb-3 team-card" data-sport="Volleyball">
        <div class="card">
          <div class="card-body">
            <h5>The Z fighters</h5>
            <p>Volleyball, Advanced<br>Thursdays 6pm<br>1 spot open</p>
            <a href="team-detail.html" class="btn btn-success">View team</a>
          </div>
        </div>
      </div>

    </div>
  </div>

  <script>
    // Showing only the cards that match the chosen sport
    function filterTeams() {
      let sport = document.getElementById("sportFilter").value;
      let cards = document.querySelectorAll(".team-card");

      for (let card of cards) {
        if (sport === "all" || card.dataset.sport === sport) {
          card.style.display = "block";
        } else {
          card.style.display = "none";
        }
      }
    }
  </script>
</body>
</html>
